<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email confirmed — vacayi</title>
<meta name="robots" content="noindex">
<style>
  /* TOKENS, not paired rules. The first version put .card's white background
     AFTER the @media block at equal specificity, so the later rule won, the
     card stayed white in dark mode and the heading — inheriting the light
     body colour — was unreadable on it. One definition per colour, redefined
     in exactly one place, and nothing can out-order anything. */
  :root{
    color-scheme:light dark;
    --bg:#FFF9F4; --card:#FFFFFF; --line:#F0E2D6;
    --ink:#241A2E; --soft:#7C6C80; --faint:#A79BB6;
    --orchid:#B0399F; --okbg:#E7F5EE; --ok:#1C7150;
    --shadow:0 1px 3px rgba(36,26,46,.07),0 10px 30px rgba(36,26,46,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14101C; --card:#1F1830; --line:#332747;
      --ink:#F5EEF9; --soft:#A79BB6; --faint:#7C6C80;
      --orchid:#C755B4; --okbg:#14332A; --ok:#4FD1A0;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.3);
    }
  }
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);padding:24px;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .card{max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:36px 28px;text-align:center;box-shadow:var(--shadow)}
  img{width:56px;height:56px;border-radius:14px;display:block;margin:0 auto 14px}
  /* EXPLICIT, not inherited. Inheriting the body colour is what made this
     invisible: light text on a card that had stayed white. */
  h1{margin:0 0 8px;font-size:23px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  .sub{margin:0;color:var(--soft);font-size:15px}
  .tick{width:52px;height:52px;border-radius:50%;margin:0 auto 16px;
    background:var(--okbg);color:var(--ok);font-size:28px;font-weight:800;
    display:flex;align-items:center;justify-content:center}
  a.open{display:inline-block;margin-top:22px;background:var(--orchid);color:#fff;
    text-decoration:none;font-weight:800;padding:13px 26px;border-radius:999px}
  .fine{margin-top:18px;font-size:13px;color:var(--faint)}
  .fine a{color:var(--faint)}
</style></head><body>
  <div class="card">
    <img src="/favicon-192.png" alt="">
    <div class="tick">&#10003;</div>
    <h1>Your email is confirmed</h1>
    <p class="sub">Open vacayi and sign in — your welcome credits are waiting.</p>
    <a class="open" href="vacayi://">Open vacayi</a>
    <p class="fine">Nothing happened when you tapped that? Just open the app from your
      home screen and sign in — you are confirmed either way.</p>
    <p class="fine"><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></p>
  </div>
</body></html>
